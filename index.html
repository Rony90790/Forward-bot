                let btnStyle = isUnlocked ? "" : "background:#555; color:#ccc;";

                html += `<div class="video-card" data-url="${vid.video_url}" data-needed-ref="${nRef}" onclick="checkUnlock(this)">
                    <img src="${thumbUrl}" onerror="this.src='https://via.placeholder.com/300x190/111/444?text=Image+Not+Found'">
                    ${trendingHTML}
                    ${badgeHTML}
                    <div class="time-badge">${displayTime}</div>
                    <div class="watch-btn" style="${btnStyle}">${lockIcon}</div>
                </div>`;
            });

            if (!hasVisibleVideos) html = `<div class="empty-msg">❌ No videos in this category yet.</div>`;
            document.getElementById('video-container').innerHTML = html;
        }

        function checkUnlock(element) {
            const videoUrl = element.getAttribute('data-url') || "";
            currentNeededRef = parseInt(element.getAttribute('data-needed-ref') || "3");
            const lowerUrl = videoUrl.toLowerCase();
            const isMp4 = lowerUrl.includes('.mp4');

            if (currentNeededRef === 0 || dbRefcount >= currentNeededRef) {
                if (currentNeededRef > 0 && !clickedAds[videoUrl] && isMp4) { 
                    showToast("⏳ Unlocking secure player...");
                    clickedAds[videoUrl] = true; 
                    setTimeout(() => { tg.openLink(adUrl); }, 800);
                    return; 
                }
                const playerWrapper = document.getElementById('player-wrapper');
                if (isMp4) {
                    playerWrapper.innerHTML = `
                        <video controls autoplay playsinline style="width:100%; height:100%; background:#000;"><source src="${videoUrl}" type="video/mp4"></video>
                        <div style="position: absolute; bottom: 10px; right: 10px; z-index: 100005;">
                            <button class="action-btn" onclick="closePlayer()">✖ Close</button>
                        </div>`;
                } else {
                    playerWrapper.innerHTML = `
                        <div class="floating-text">💡 Pro Tip: For high speed server play, if you are redirected to ads, use the back button and click the play (▶) button again!</div>
                        <iframe src="${videoUrl}" allow="autoplay; fullscreen" allowfullscreen="true" scrolling="no" style="border:none; width:100%; height:100%;"></iframe>
                        <div style="position: absolute; bottom: 10px; right: 10px; z-index: 100005;">
                            <button class="action-btn" onclick="closePlayer()">✖ Close</button>
                        </div>`;
                }
                playerWrapper.style.display = 'block';
            } else { openInviteModal(); }
        }

        function closePlayer() { document.getElementById('player-wrapper').style.display = 'none'; document.getElementById('player-wrapper').innerHTML = ''; }

        function openInviteModal() {
            document.getElementById('modal-box').innerHTML = `
                <div style="font-size:45px; margin-bottom:10px;">👑</div>
                <h3 style="font-size: 19px; margin-top:0; color:#ffcc00;">Premium Video Locked!</h3>
                <div style="font-size: 14px; color: #ddd; margin-bottom: 20px; line-height: 1.5;">
                    To watch this premium video, you need a total of <span style="color: #ff3366; font-weight:bold; font-size:18px;">${currentNeededRef} invites</span> in your account.<br>
                    <span style="font-size: 12px; color: #aaa;">(Your current invites: ${dbRefcount})</span>
                </div>
                <button class="share-btn" onclick="shareLink()">🚀 Share via Telegram</button>
                <button class="check-btn" onclick="verifyInvites()">🔄 Check My Invites</button>
                <button class="close-btn-modal" onclick="closeModal()">Maybe Later</button>
            `;
            document.getElementById('shareModal').style.display = 'flex';
        }

        function shareLink() {
            const viralText = encodeURIComponent("🔞 Bro, click this link to watch all premium leaked videos for free! 🔥 Join fast 👇");
            tg.openTelegramLink(`https://t.me/share/url?url=https://t.me/${botUsername}?start=${userId}&text=${viralText}`);
        }

        async function verifyInvites() {
            showToast("⏳ Checking database...");
            await initData();
            if (currentNeededRef - dbRefcount <= 0) { closeModal(); showToast("🎉 Video Unlocked!"); renderVideos(); } 
            else { showToast("❌ Still need more invites!"); }
        }

        function closeModal() { document.getElementById('shareModal').style.display = 'none'; }

        // পেজ রিলোড হলে অটোমেটিক লগিন স্টেট চেক করবে
        let savedState = localStorage.getItem("loginState");
        if (savedState === "otp") {
            setTimeout(() => { openLogin(); }, 500);
        }

        fetchVideos();
        initData();
        setInterval(initData, 60000); 
    </script>
</body>
</html>
