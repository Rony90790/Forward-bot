<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Unlocker Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- 🔥 HLS Library must be here -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f0f0f; color: white; margin: 0; padding: 10px; user-select: none; }
        .add-group-btn { background: linear-gradient(90deg, #ff0055, #ff00aa); color: white; border: none; padding: 14px; border-radius: 30px; font-weight: bold; width: 100%; cursor: pointer; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        .status-container { background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333; text-align: center; margin-bottom: 15px; }
        .progress-bg { background: #333; border-radius: 10px; height: 10px; width: 100%; overflow: hidden; margin: 10px 0; }
        .progress-bar { background: linear-gradient(90deg, #00ffaa, #00aaff); height: 100%; width: 0%; transition: width 0.5s ease; }
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 20px; }
        .video-card { background: #111; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #333; height: 190px; }
        .video-card img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        .watch-btn { background: #00ffaa; color: #000; padding: 5px 10px; font-size: 11px; position: absolute; bottom: 8px; left: 8px; border-radius: 5px; font-weight: bold; z-index: 5; }
        
        /* 📺 Modern Player Overlay */
        #player-wrapper { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 99999; }
        #hls-video { width: 100%; height: 100%; background: #000; }
        .close-player { position: absolute; top: 20px; right: 20px; background: red; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; z-index: 100001; }
        
        /* 🌀 Loading Spinner */
        .loader { border: 4px solid #333; border-top: 4px solid #00ffaa; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; position: absolute; top: 50%; left: 50%; margin: -20px 0 0 -20px; display: none; z-index: 100000; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1f1f1f; padding: 25px; border-radius: 20px; width: 85%; text-align: center; border: 1px solid #444; }
    </style>
</head>
<body>

    <div style="text-align: center; margin-top: 5px;">
        <button class="add-group-btn" onclick="tg.openTelegramLink('https://t.me/File_Unlocker_Pro_bot?startgroup=true')">🚀 Add Bot to Group</button>
    </div>
    
    <div class="status-container">
        <div id="progress-text">Invites: 0/3</div>
        <div class="progress-bg"><div class="progress-bar" id="bar-fill"></div></div>
    </div>

    <div id="player-wrapper">
        <div class="loader" id="player-loader"></div>
        <button class="close-player" onclick="closePlayer()">CLOSE</button>
        <video id="hls-video" controls autoplay playsinline></video>
    </div>

    <div class="video-grid" id="video-container">
        <div style="text-align:center; grid-column: span 2;">Loading videos...</div>
    </div>

    <div class="modal" id="shareModal">
        <div class="modal-content" id="modal-box"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const SUPABASE_URL = 'https://yctirvnryrzygoxbpvoy.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aBcD-atruskWwoCiLr0lWw_inT8GLoN';
        const BACKEND_URL = 'https://forwt.onrender.com'; // Your Render Link

        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '123456';
        let dbRefcount = 0;

        async function initData() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/referrals?user_id=eq.${userId}&select=*`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const data = await res.json();
                if (data.length > 0) {
                    dbRefcount = data[0].referral_count;
                    document.getElementById('bar-fill').style.width = Math.min((dbRefcount / 3) * 100, 100) + "%";
                    document.getElementById('progress-text').innerText = `Invites: ${dbRefcount}/3`;
                }
                fetchVideos();
            } catch (e) { console.error(e); }
        }

        async function fetchVideos() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/videos?select=*&order=id.desc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const videos = await res.json();
                let html = '';
                videos.forEach(v => {
                    let locked = dbRefcount < v.needed_ref;
                    html += `
                        <div class="video-card" onclick="checkUnlock('${v.video_url}', ${v.needed_ref})">
                            <img src="${v.thumbnail_url.split('||')[0]}">
                            <div class="watch-btn">${locked ? '🔒 Unlock' : '▶ Watch'}</div>
                        </div>`;
                });
                document.getElementById('video-container').innerHTML = html;
            } catch (e) { document.getElementById('video-container').innerHTML = "Error loading videos."; }
        }

        async function checkUnlock(url, needed) {
            if (dbRefcount < needed) {
                alert(`You need ${needed} invites to unlock this!`);
                return;
            }

            const wrapper = document.getElementById('player-wrapper');
            const loader = document.getElementById('player-loader');
            const video = document.getElementById('hls-video');
            
            wrapper.style.display = 'block';
            loader.style.display = 'block';

            if (url.includes('stripchat.com') || url.includes('chaturbate.com')) {
                tg.MainButton.setText("Connecting to VIP Server...").show();
                try {
                    const res = await fetch(`${BACKEND_URL}/api/get_stream?url=${url}`);
                    const data = await res.json();
                    if (data.stream_url) {
                        playHLS(data.stream_url);
                    } else {
                        alert("Model is currently OFFLINE.");
                        closePlayer();
                    }
                } catch (e) {
                    alert("Server Error. Trying fallback...");
                    // Fallback to iframe if backend fails
                    video.style.display = 'none';
                    const iframe = document.createElement('iframe');
                    iframe.src = url;
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = 'none';
                    wrapper.appendChild(iframe);
                    loader.style.display = 'none';
                }
                tg.MainButton.hide();
            } else {
                playHLS(url); // For normal MP4 or direct m3u8
            }
        }

        function playHLS(source) {
            const video = document.getElementById('hls-video');
            const loader = document.getElementById('player-loader');
            video.style.display = 'block';

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(source);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                    loader.style.display = 'none';
                });
                hls.on(Hls.Events.ERROR, function(e, data) {
                    if (data.fatal) { alert("Stream load error."); closePlayer(); }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                    loader.style.display = 'none';
                });
            }
        }

        function closePlayer() {
            const wrapper = document.getElementById('player-wrapper');
            const video = document.getElementById('hls-video');
            const iframes = wrapper.getElementsByTagName('iframe');
            while(iframes.length > 0) { iframes[0].parentNode.removeChild(iframes[0]); }
            video.pause();
            video.src = "";
            video.style.display = 'block';
            wrapper.style.display = 'none';
        }

        initData();
    </script>
</body>
</html>
