<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Unlocker Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f0f0f; color: white; margin: 0; padding: 10px; user-select: none; touch-action: manipulation; overflow-x: hidden; }
        
        .add-group-btn { background: linear-gradient(90deg, #ff0055, #ff00aa); color: white; border: none; padding: 14px; border-radius: 30px; font-weight: bold; width: 100%; cursor: pointer; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        
        .online-badge { background: rgba(0, 255, 0, 0.1); color: #00ff00; border: 1px solid #00ff00; padding: 5px 12px; border-radius: 20px; font-size: 11px; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px; font-weight: bold; }
        .dot { height: 7px; width: 7px; background-color: #00ff00; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .status-container { background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333; text-align: center; margin-bottom: 15px; }
        .progress-bg { background: #333; border-radius: 10px; height: 10px; width: 100%; overflow: hidden; margin: 10px 0; }
        .progress-bar { background: linear-gradient(90deg, #00ffaa, #00aaff); height: 100%; width: 0%; transition: width 0.5s ease; }

        .filter-container { display: flex; gap: 8px; margin-bottom: 15px; }
        .filter-btn { flex: 1; padding: 8px 5px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 12px; }
        .btn-active { background: linear-gradient(90deg, #00ffaa, #00aaff); color: #000; box-shadow: 0 2px 10px rgba(0, 255, 170, 0.3); }
        .btn-inactive { background: #333; color: #fff; border: 1px solid #444; }

        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 20px;}
        .video-card { background: #111; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #333; cursor: pointer; height: 190px; }
        /* Crop fixed for screenshots */
        .video-card img { position: absolute; top: -10%; left: -10%; width: 120%; height: 120%; object-fit: cover; background-color: #1a1a1a; }
        
        .views-badge { background: rgba(0, 0, 0, 0.8); color: #fff; padding: 3px 7px; font-size: 10px; position: absolute; top: 7px; right: 7px; border-radius: 4px; z-index: 3; }
        .time-badge { background: rgba(0, 0, 0, 0.8); color: #fff; padding: 3px 6px; font-size: 10px; position: absolute; bottom: 7px; right: 7px; border-radius: 4px; z-index: 3; }
        .watch-btn { background: rgba(255, 170, 0, 0.95); color: #000; padding: 4px 8px; font-size: 11px; position: absolute; bottom: 7px; left: 7px; border-radius: 5px; font-weight: bold; z-index: 3;}

        /* App Player Styles */
        #player-wrapper { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 99999; }
        .close-player-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: #ff3b30; color: #fff; padding: 12px 30px; border-radius: 50px; font-weight: bold; z-index: 100000; border: none; box-shadow: 0 4px 20px rgba(255,0,0,0.5); }
        iframe { width: 100%; height: 100%; border: none; background: #000; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1f1f1f; padding: 25px; border-radius: 20px; width: 85%; text-align: center; border: 1px solid #444; }
        .share-btn { background: linear-gradient(90deg, #0088cc, #00aaff); color: white; border: none; padding: 14px; border-radius: 10px; width: 100%; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div style="text-align: center; margin-top: 5px;">
        <button class="add-group-btn" onclick="tg.openTelegramLink(`https://t.me/${botUsername}?startgroup=true`)">🚀 Add Bot to Group</button>
        <div class="online-badge" style="margin-top: 10px;"><span class="dot"></span> <span id="online-count">1,240</span> watching</div>
    </div>
    
    <div class="status-container">
        <div id="progress-text" style="font-size: 13px;">Total Invites: 0</div>
        <div class="progress-bg"><div class="progress-bar" id="bar-fill"></div></div>
    </div>

    <div id="player-wrapper"></div>
    
    <div class="filter-container">
        <button id="btn-all" class="filter-btn btn-active" onclick="setFilter('all')">📺 All Videos</button>
        <button id="btn-unlocked" class="filter-btn btn-inactive" onclick="setFilter('unlocked')">🔓 Unlocked</button>
    </div>

    <div class="video-grid" id="video-container"></div>

    <div class="modal" id="shareModal">
        <div class="modal-content" id="modal-box"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const SUPABASE_URL = 'https://yctirvnryrzygoxbpvoy.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aBcD-atruskWwoCiLr0lWw_inT8GLoN';
        const fetchHeaders = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };

        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '123456'; 
        const botUsername = 'File_Unlocker_Pro_bot'; 
        const adUrl = "https://www.effectivecpmnetwork.com/w47jpksk7t?key=15b5e8ae609b09733d4a0906eac2a446";
        
        let dbRefcount = 0, lastRefCount = -1, allVideos = [], filterMode = 'all'; 

        async function initData() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/referrals?user_id=eq.${userId}&select=referral_count`, { headers: fetchHeaders });
                const data = await res.json();
                let currentRef = data.length > 0 ? data[0].referral_count : 0;
                if (currentRef !== lastRefCount) {
                    dbRefcount = currentRef; lastRefCount = dbRefcount;
                    document.getElementById('bar-fill').style.width = Math.min((dbRefcount / 3) * 100, 100) + "%";
                    document.getElementById('progress-text').innerText = `Total Invites: ${dbRefcount}`;
                    renderVideos(); 
                }
            } catch (err) { console.log(err); }
        }

        async function fetchVideos() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/videos?select=*&order=id.desc`, { headers: fetchHeaders });
                const videos = await res.json();
                if (videos) { allVideos = videos; renderVideos(); }
            } catch (err) { console.log(err); }
        }

        function setFilter(mode) {
            filterMode = mode;
            document.getElementById('btn-all').className = mode === 'all' ? 'filter-btn btn-active' : 'filter-btn btn-inactive';
            document.getElementById('btn-unlocked').className = mode === 'unlocked' ? 'filter-btn btn-active' : 'filter-btn btn-inactive';
            renderVideos();
        }

        function renderVideos() {
            let html = '';
            allVideos.forEach(vid => {
                let nRef = vid.needed_ref || 0;
                let isUnlocked = (nRef === 0 || dbRefcount >= nRef);
                if (filterMode === 'unlocked' && !isUnlocked) return;

                let thumb = vid.thumbnail_url.split('||')[0];
                let time = vid.thumbnail_url.includes('||') ? vid.thumbnail_url.split('||')[1] : "HD";
                if(time === 'random') time = "Live";

                html += `<div class="video-card" onclick="handlePlay('${vid.video_url}', ${nRef})">
                    <img src="${thumb}">
                    <div class="views-badge">${isUnlocked ? '👁️ '+(1000+Math.floor(Math.random()*500)) : '🔒 '+nRef+' Refer'}</div>
                    <div class="time-badge">${time}</div>
                    <div class="watch-btn">▶ Watch</div>
                </div>`;
            });
            document.getElementById('video-container').innerHTML = html;
        }

        function handlePlay(url, nRef) {
            if (nRef !== 0 && dbRefcount < nRef) {
                showInviteModal(nRef);
                return;
            }

            const player = document.getElementById('player-wrapper');
            let finalUrl = url.trim();
            const lowerUrl = finalUrl.toLowerCase();

            // 🚀 STRIPCHAT INTERNAL PLAYER FIX
            if (lowerUrl.includes('stripchat.com')) {
                // Extract model name and use the Direct Embed URL
                const modelName = finalUrl.split('/').pop().split('?')[0];
                finalUrl = `https://stripchat.com/in/direct-embed/${modelName}?muted=1&autoPlay=1`;
                
                player.innerHTML = `<button class="close-player-btn" onclick="closePlayer()">CLOSE PLAYER</button>
                    <iframe src="${finalUrl}" allow="autoplay; fullscreen; microphone; camera;" allowfullscreen="true" scrolling="no"></iframe>`;
                player.style.display = 'block';
                return;
            }

            // Standard Video / MP4 Logic
            if (lowerUrl.includes('.mp4')) {
                player.innerHTML = `<button class="close-player-btn" onclick="closePlayer()">CLOSE PLAYER</button>
                    <video controls autoplay playsinline style="width:100%; height:100%;"><source src="${finalUrl}" type="video/mp4"></video>`;
            } else {
                player.innerHTML = `<button class="close-player-btn" onclick="closePlayer()">CLOSE PLAYER</button>
                    <iframe src="${finalUrl}" allow="autoplay; fullscreen" allowfullscreen="true"></iframe>`;
            }
            player.style.display = 'block';
        }

        function closePlayer() {
            const player = document.getElementById('player-wrapper');
            player.style.display = 'none';
            player.innerHTML = '';
        }

        function showInviteModal(needed) {
            const remaining = needed - dbRefcount;
            document.getElementById('modal-box').innerHTML = `
                <h3 style="color:#ffaa00;">Invite ${remaining} more friends!</h3>
                <p style="font-size:13px; color:#888;">To watch this premium video, you need ${needed} referrals.</p>
                <button class="share-btn" onclick="shareLink()">🚀 Share Now</button>
                <button onclick="document.getElementById('shareModal').style.display='none'" style="background:none; border:none; color:#666; margin-top:15px; text-decoration:underline;">Maybe Later</button>
            `;
            document.getElementById('shareModal').style.display = 'flex';
        }

        function shareLink() {
            const shareUrl = `https://t.me/share/url?url=https://t.me/${botUsername}?start=${userId}&text=${encodeURIComponent("Watch premium viral videos FREE! 👇")}`;
            tg.openTelegramLink(shareUrl);
        }

        fetchVideos();
        initData();
        setInterval(initData, 5000);
    </script>
</body>
</html>
