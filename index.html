<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Unlocker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 0; padding: 10px; }
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .video-card { background: #222; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #333; }
        .video-card img { width: 100%; height: 160px; object-fit: cover; cursor: pointer; }
        
        /* Watch Now Button - Left Side */
        .watch-btn { background: rgba(0, 0, 0, 0.7); color: #ffaa00; padding: 6px 10px; font-size: 13px; position: absolute; bottom: 8px; left: 8px; border-radius: 5px; font-weight: bold; border: 1px solid #ffaa00; }
        
        /* Duration Badge - Right Side */
        .duration-badge { background: rgba(0, 0, 0, 0.85); color: white; padding: 4px 6px; font-size: 12px; position: absolute; bottom: 8px; right: 8px; border-radius: 5px; font-weight: bold; border: 1px solid #444; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #2a2a2a; padding: 25px; border-radius: 12px; width: 85%; text-align: center; box-sizing: border-box; border: 1px solid #444; }
        
        .modal-content h3 { margin-top: 0; font-size: 17px; line-height: 1.4; color: #ffffff;}
        .subtitle { display: block; font-size: 13px; color: #aaaaaa; font-weight: normal; margin-top: 5px; } /* ট্রান্সলেশন স্টাইল */

        .share-btn { background: #0088cc; color: white; border: none; padding: 10px 15px; border-radius: 8px; width: 100%; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); line-height: 1.3;}
        .share-btn span { font-size: 13px; color: #e0e0e0; font-weight: normal; display: block;}
        
        .close-btn { background: #555; color: white; border: none; padding: 8px 15px; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer; font-weight: bold; line-height: 1.3;}
        .close-btn span { font-size: 12px; color: #ccc; font-weight: normal; display: block;}

        .status-bar { text-align: center; margin-top: 10px; padding: 12px; background: #222; border-radius: 8px; color: yellow; font-weight: bold; border: 1px solid #444; line-height: 1.4;}
        .status-bar span { font-size: 12px; color: #bbbbbb; font-weight: normal; display: block;}
    </style>
</head>
<body>
    
    <div class="status-bar" id="referral-status">
        Loading...
        <span>লোড হচ্ছে...</span>
    </div>

    <!-- ডাইনামিক ভিডিও গ্রিড -->
    <div class="video-grid" id="video-container">
        <div style="text-align:center; color:white; grid-column: span 2; padding: 20px;">
            Loading videos, please wait...
            <span class="subtitle">ভিডিও লোড হচ্ছে, দয়া করে অপেক্ষা করুন...</span>
        </div>
    </div>

    <!-- Pop-up Modal -->
    <div class="modal" id="shareModal">
        <div class="modal-content">
            <h3>
                To watch the video, please share the bot in 3 groups or with friends.
                <span class="subtitle">(ভিডিওটি দেখতে, অনুগ্রহ করে বটটি ৩টি গ্রুপে বা বন্ধুদের শেয়ার করুন)</span>
            </h3>
            <button class="share-btn" onclick="shareLink()">
                🚀 Share Now
                <span>🚀 এখনই শেয়ার করুন</span>
            </button>
            <button class="close-btn" onclick="closeModal()">
                Close
                <span>বন্ধ করুন</span>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const SUPABASE_URL = 'https://yctirvnryrzygoxbpvoy.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aBcD-atruskWwoCiLr0lWw_inT8GLoN';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '123456'; 
        const botUsername = 'File_Unlocker_Pro_bot'; 
        
        let unlocked = false;
        
        // অ্যাডের লিংক
        const adUrl = "https://www.effectivecpmnetwork.com/w47jpksk7t?key=15b5e8ae609b09733d4a0906eac2a446";
        let clickedAds = {}; // কোন ভিডিওতে অ্যাড দেখা হয়েছে তা ট্র্যাক করবে

        async function checkReferrals() {
            try {
                let { data, error } = await db.from('referrals').select('referral_count').eq('user_id', userId).single();
                const statusDiv = document.getElementById('referral-status');
                const count = data ? data.referral_count : 0;

                if (count < 3) {
                    statusDiv.innerHTML = `
                        Invites Completed: ${count}/3
                        <span>ইনভাইট সম্পন্ন: ${count}/৩ জন</span>
                    `;
                    statusDiv.style.color = "yellow";
                    unlocked = false;
                } else {
                    statusDiv.innerHTML = `
                        ✅ Unlock Successful! You can watch videos now.
                        <span style="color:#00cc00;">✅ আনলক সম্পন্ন! এখন ভিডিও দেখতে পারবেন।</span>
                    `;
                    statusDiv.style.color = "#00ff00";
                    unlocked = true;
                }
            } catch (err) { 
                console.log("Referral Check Error: ", err); 
            }
        }

        async function fetchVideos() {
            try {
                let { data: videos, error } = await db.from('videos').select('*').order('id', { ascending: false });
                
                if (error) throw error;

                const container = document.getElementById('video-container');
                let html = '';
                
                if (videos && videos.length > 0) {
                    videos.forEach(vid => {
                        // ২ থেকে ৭ মিনিটের মধ্যে র‍্যান্ডম টাইম জেনারেট
                        let minutes = Math.floor(Math.random() * 6) + 2; 
                        let seconds = Math.floor(Math.random() * 60); 
                        let duration = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

                        html += `
                            <div class="video-card" onclick="checkUnlock('${vid.video_url}')">
                                <img src="${vid.thumbnail_url}" alt="Video">
                                <div class="watch-btn">▶ Watch Now</div>
                                <div class="duration-badge">${duration}</div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `
                        <div style='text-align:center; color:white; grid-column: span 2;'>
                            No videos found!
                            <span class="subtitle">কোনো ভিডিও পাওয়া যায়নি!</span>
                        </div>
                    `;
                }
            } catch (err) {
                document.getElementById('video-container').innerHTML = `
                    <div class='status-bar'>
                        Server error loading videos!
                        <span>সার্ভার থেকে ভিডিও লোড হতে সমস্যা হচ্ছে!</span>
                    </div>
                `;
                console.log("Fetch Video Error: ", err);
            }
        }

        function checkUnlock(videoUrl) {
            if (unlocked) {
                // যদি এই ভিডিওতে আগে অ্যাড ক্লিক না করা হয়ে থাকে
                if (!clickedAds[videoUrl]) {
                    clickedAds[videoUrl] = true; // অ্যাড দেখা মার্ক করা হলো
                    tg.openLink(adUrl); // Ad লিংক ওপেন হবে
                } else {
                    // ২য় বারে আসল ভিডিও ওপেন হবে
                    if (videoUrl.includes('t.me') || videoUrl.includes('telegram.me')) {
                        tg.openTelegramLink(videoUrl); 
                    } else {
                        tg.openLink(videoUrl); 
                    }
                }
            } else {
                document.getElementById('shareModal').style.display = 'flex';
            }
        }

        function closeModal() { 
            document.getElementById('shareModal').style.display = 'none'; 
        }

        function shareLink() {
            const shareText = "Watch viral videos by clicking the link below 👇👇👇\n\nভাইরাল ভিডিও দেখতে নিচের লিংকে ক্লিক করো 👇👇👇";
            const botUrl = `https://t.me/${botUsername}?start=${userId}`;
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(botUrl)}&text=${encodeURIComponent(shareText)}`;
            tg.openTelegramLink(shareUrl);
        }

        // Initial Calls
        checkReferrals();
        fetchVideos(); 
        setInterval(checkReferrals, 5000); 
    </script>
</body>
</html>
