<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Unlocker Pro - Premium</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: white; margin: 0; padding: 10px; 
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        }

        /* 🟢 Live Online Counter Badge */
        .online-badge {
            background: rgba(0, 255, 0, 0.1);
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .dot { height: 8px; width: 8px; background-color: #00ff00; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* 🟢 Status & Progress Bar Styles */
        .status-container {
            background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; text-align: center;
        }
        .progress-title { font-size: 14px; margin-bottom: 8px; color: #ccc; }
        .progress-bg { background: #333; border-radius: 10px; height: 12px; width: 100%; overflow: hidden; margin: 10px 0; }
        .progress-bar { 
            background: linear-gradient(90deg, #ffaa00, #ffcc00); 
            height: 100%; width: 0%; transition: width 0.5s ease-in-out; 
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
        }

        /* Video Grid Styles */
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; padding-bottom: 20px;}
        .video-card { background: #222; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #333; cursor: pointer; transition: transform 0.2s;}
        .video-card:active { transform: scale(0.96); }
        .video-card img { width: 100%; height: 150px; object-fit: cover; pointer-events: none; }
        
        .views-badge { background: rgba(0, 0, 0, 0.75); color: white; padding: 4px 6px; font-size: 11px; position: absolute; top: 8px; right: 8px; border-radius: 6px; border: 1px solid #444;}
        .watch-btn { background: rgba(255, 170, 0, 0.9); color: #000; padding: 5px 10px; font-size: 12px; position: absolute; bottom: 8px; left: 8px; border-radius: 6px; font-weight: bold; }
        .duration-badge { background: rgba(0, 0, 0, 0.85); color: white; padding: 4px 6px; font-size: 11px; position: absolute; bottom: 8px; right: 8px; border-radius: 6px; border: 1px solid #444; }

        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1f1f1f; padding: 25px; border-radius: 20px; width: 85%; text-align: center; border: 1px solid #444; }
        .share-btn { background: linear-gradient(90deg, #0088cc, #00aaff); color: white; border: none; padding: 14px; border-radius: 10px; width: 100%; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);}
        .close-btn { background: transparent; color: #888; border: none; margin-top: 15px; cursor: pointer; font-size: 14px; text-decoration: underline;}
        
        .subtitle { display: block; font-size: 12px; color: #888; margin-top: 5px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- 🟢 Social Proof: Online Counter -->
    <div style="text-align: center; margin-top: 5px;">
        <div class="online-badge">
            <span class="dot"></span> <span id="online-count">1,240</span> people are watching now
        </div>
    </div>
    
    <!-- 🟢 Progress Bar Container -->
    <div class="status-container">
        <div class="progress-title" id="progress-text">Unlock Progress: 0/3</div>
        <div class="progress-bg">
            <div class="progress-bar" id="bar-fill"></div>
        </div>
        <div id="referral-status-text" style="font-size: 13px; color: #ffaa00; font-weight: bold;">
            Share to unlock videos!
            <span class="subtitle">[Translation] ভিডিও আনলক করতে শেয়ার করুন!</span>
        </div>
    </div>

    <div class="video-grid" id="video-container">
        <!-- Videos will load here -->
    </div>

    <!-- Share Modal -->
    <div class="modal" id="shareModal">
        <div class="modal-content">
            <h3 id="modal-main-text" style="font-size: 18px; line-height: 1.4;">
                Complete <span id="needed-count" style="color: #ffaa00; font-size: 22px;">3</span> more invites to watch!
                <span class="subtitle" style="color: #bbb;">ভিডিওটি দেখতে আরও <span id="needed-count-bn">৩</span> জনকে ইনভাইট করুন।</span>
            </h3>
            <button class="share-btn" onclick="shareLink()">🚀 Share to Groups / Friends</button>
            <button class="close-btn" onclick="closeModal()">Maybe Later</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const SUPABASE_URL = 'https://yctirvnryrzygoxbpvoy.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aBcD-atruskWwoCiLr0lWw_inT8GLoN';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '123456'; 
        const botUsername = 'File_Unlocker_Pro_bot'; 
        
        let unlocked = false;
        let currentCount = 0;
        const adUrl = "https://www.effectivecpmnetwork.com/w47jpksk7t?key=15b5e8ae609b09733d4a0906eac2a446";
        let clickedAds = {}; 

        // 🟢 ডাইনামিক অনলাইন কাউন্টার (Social Proof)
        function updateOnlineCount() {
            const base = 1200;
            const random = Math.floor(Math.random() * 100);
            document.getElementById('online-count').innerText = (base + random).toLocaleString();
        }
        setInterval(updateOnlineCount, 3000);

        async function checkReferrals() {
            if(unlocked) return;

            try {
                let { data, error } = await db.from('referrals').select('referral_count').eq('user_id', userId).single();
                const count = data ? data.referral_count : 0;
                currentCount = count;

                // 🟢 প্রগ্রেস বার আপডেট
                const percentage = Math.min((count / 3) * 100, 100);
                document.getElementById('bar-fill').style.width = percentage + "%";
                document.getElementById('progress-text').innerText = `Unlock Progress: ${count}/3`;

                if (count >= 3) {
                    document.getElementById('referral-status-text').innerHTML = "✅ All Videos Unlocked! <span class='subtitle' style='color:#00ff00;'>সব ভিডিও আনলক হয়েছে!</span>";
                    document.getElementById('referral-status-text').style.color = "#00ff00";
                    unlocked = true;
                }
            } catch (err) { console.log(err); }
        }

        async function fetchVideos() {
            try {
                let { data: videos } = await db.from('videos').select('*').order('id', { ascending: false });
                const container = document.getElementById('video-container');
                let html = '';
                
                videos.forEach(vid => {
                    let views = Math.floor(Math.random() * 500) + 1200; 
                    html += `
                        <div class="video-card" data-url="${vid.video_url}" onclick="checkUnlock(this)">
                            <img src="${vid.thumbnail_url}" draggable="false">
                            <div class="views-badge">👁️ ${views.toLocaleString()}</div> 
                            <div class="watch-btn">▶ Watch</div>
                            <div class="duration-badge">${Math.floor(Math.random() * 5)+3}:${Math.floor(Math.random() * 50)+10}</div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) { console.log(err); }
        }

        function checkUnlock(element) {
            if (unlocked) {
                const videoUrl = element.getAttribute('data-url');
                if (!clickedAds[videoUrl]) {
                    clickedAds[videoUrl] = true; 
                    tg.openLink(adUrl);
                } else {
                    if (videoUrl.includes('t.me')) tg.openTelegramLink(videoUrl); 
                    else tg.openLink(videoUrl); 
                }
            } else {
                document.getElementById('needed-count').innerText = 3 - currentCount;
                document.getElementById('needed-count-bn').innerText = 3 - currentCount;
                document.getElementById('shareModal').style.display = 'flex';
            }
        }

        // 🟢 ৩. শেয়ার টেক্সট পরিবর্তন (Dynamic Share Messages)
        function shareLink() {
            const messages = [
                "🔥 Watch premium viral videos for FREE! Click here 👇",
                "😱 I just found the best viral video collection! Check it out 👇",
                "🔞 New Viral Content Updated! Watch now before it's gone 👇",
                "✅ This bot is amazing! Watch all premium videos for free 👇"
            ];
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            
            const botUrl = `https://t.me/${botUsername}?start=${userId}`;
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(botUrl)}&text=${encodeURIComponent(randomMsg)}`;
            
            tg.openTelegramLink(shareUrl);
        }

        function closeModal() { document.getElementById('shareModal').style.display = 'none'; }

        checkReferrals();
        fetchVideos(); 
        setInterval(checkReferrals, 8000); 
    </script>
</body>
</html>
