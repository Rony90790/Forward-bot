<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Unlocker Pro - Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: white; margin: 0; padding: 10px; 
            -webkit-user-select: none; user-select: none;
        }

        /* 🚀 Add to Group Button Styling */
        .add-group-container { text-align: center; margin: 10px 0 20px 0; }
        .add-group-btn {
            background: linear-gradient(90deg, #ff0055, #ff00aa);
            color: white; border: none; padding: 14px 20px; border-radius: 30px;
            font-weight: bold; font-size: 14px; width: 100%; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }

        /* Online Counter */
        .online-badge {
            background: rgba(0, 255, 0, 0.1); color: #00ff00; border: 1px solid #00ff00;
            padding: 5px 12px; border-radius: 20px; font-size: 12px; display: inline-flex;
            align-items: center; gap: 6px; margin-bottom: 10px; font-weight: bold;
        }
        .dot { height: 8px; width: 8px; background-color: #00ff00; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Progress Bar */
        .status-container { background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333; text-align: center; }
        .progress-bg { background: #333; border-radius: 10px; height: 12px; width: 100%; overflow: hidden; margin: 10px 0; }
        .progress-bar { background: linear-gradient(90deg, #ffaa00, #ffcc00); height: 100%; width: 0%; transition: width 0.5s ease; }

        /* Video Grid */
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .video-card { background: #222; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #333; }
        .video-card img { width: 100%; height: 150px; object-fit: cover; }
        .watch-btn { background: rgba(255, 170, 0, 0.9); color: #000; padding: 5px 10px; font-size: 12px; position: absolute; bottom: 8px; left: 8px; border-radius: 6px; font-weight: bold; }
        .views-badge { background: rgba(0,0,0,0.7); color: white; padding: 3px 6px; font-size: 10px; position: absolute; top: 8px; right: 8px; border-radius: 5px; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1f1f1f; padding: 25px; border-radius: 20px; width: 85%; text-align: center; border: 1px solid #444; }
        .share-btn { background: #0088cc; color: white; border: none; padding: 14px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: bold; margin-top: 15px; }
        .close-btn { background: #333; color: #fff; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- 🟢 Add to Group Section -->
    <div class="add-group-container">
        <button class="add-group-btn" onclick="addToGroup()">🚀 Add Bot to Group (Daily Videos)</button>
        <div style="font-size: 11px; color: #888; margin-top: 5px;">Get premium viral videos in your group automatically!</div>
    </div>

    <div style="text-align: center;">
        <div class="online-badge"><span class="dot"></span> <span id="online-count">1,240</span> watching now</div>
    </div>
    
    <div class="status-container">
        <div id="progress-text" style="font-size: 13px;">Unlock Progress: 0/3</div>
        <div class="progress-bg"><div class="progress-bar" id="bar-fill"></div></div>
    </div>

    <div class="video-grid" id="video-container"></div>

    <div class="modal" id="shareModal"><div class="modal-content" id="modal-box"></div></div>

    <script>
        const tg = window.Telegram.WebApp;
        const SUPABASE_URL = 'https://yctirvnryrzygoxbpvoy.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aBcD-atruskWwoCiLr0lWw_inT8GLoN';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const botUsername = 'File_Unlocker_Pro_bot'; 
        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '123456'; 

        let unlocked = false, dbRefcount = 0, sessionShareClicks = 0;
        const adUrl = "https://www.effectivecpmnetwork.com/w47jpksk7t?key=15b5e8ae609b09733d4a0906eac2a446";

        function addToGroup() {
            tg.openTelegramLink(`https://t.me/${botUsername}?startgroup=true`);
        }

        async function checkReferrals() {
            if(unlocked) return;
            let { data } = await db.from('referrals').select('referral_count').eq('user_id', userId).single();
            dbRefcount = data ? data.referral_count : 0;
            document.getElementById('bar-fill').style.width = (dbRefcount/3)*100 + "%";
            document.getElementById('progress-text').innerText = `Unlock Progress: ${dbRefcount}/3`;
            if (dbRefcount >= 3) { unlocked = true; closeModal(); }
        }

        async function fetchVideos() {
            let { data: videos } = await db.from('videos').select('*').order('id', { ascending: false });
            let html = '';
            videos.forEach(vid => {
                html += `<div class="video-card" onclick="checkUnlock('${vid.video_url}')">
                    <img src="${vid.thumbnail_url}">
                    <div class="views-badge">👁️ ${(1200 + Math.floor(Math.random()*500)).toLocaleString()}</div> 
                    <div class="watch-btn">▶ Watch</div>
                </div>`;
            });
            document.getElementById('video-container').innerHTML = html;
        }

        function checkUnlock(url) {
            if (unlocked) { tg.openLink(adUrl); setTimeout(() => tg.openLink(url), 1000); }
            else { resetModal(); document.getElementById('shareModal').style.display = 'flex'; }
        }

        function resetModal() {
            sessionShareClicks = 0;
            document.getElementById('modal-box').innerHTML = `
                <h3>Invite 3 more people!</h3>
                <button class="share-btn" onclick="shareLink()">🚀 Share Now</button>
                <button class="close-btn" onclick="closeModal()">Close</button>
            `;
        }

        function shareLink() {
            sessionShareClicks++;
            const botUrl = `https://t.me/${botUsername}?start=${userId}`;
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(botUrl)}&text=Watch%20Viral%20Videos%20FREE!`;
            if (sessionShareClicks < 3) { tg.openTelegramLink(shareUrl); }
            else { showWait(); tg.openTelegramLink(shareUrl); }
        }

        function showWait() {
            document.getElementById('modal-box').innerHTML = `
                <h2 style="color:#00ff00;">✅ Done!</h2>
                <p>Videos will unlock once 3 friends join.</p>
                <button class="close-btn" onclick="closeModal()">Close</button>
            `;
        }

        function closeModal() { document.getElementById('shareModal').style.display = 'none'; }
        
        checkReferrals(); fetchVideos(); setInterval(checkReferrals, 8000);
    </script>
</body>
</html>
