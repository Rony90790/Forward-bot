<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Unlocker Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 10px; user-select: none; }
        .header { text-align: center; margin-bottom: 15px; }
        .progress-box { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px; }
        .bar-bg { background: #333; height: 10px; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        .bar-fill { background: #00ffaa; height: 100%; width: 0%; transition: 0.5s; }
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: #111; border-radius: 10px; overflow: hidden; border: 1px solid #222; position: relative; height: 180px; }
        .card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .card-info { position: absolute; bottom: 8px; left: 8px; z-index: 2; }
        .card-info span { background: #00ffaa; color: #000; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .lock-icon { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8); padding: 4px; border-radius: 50%; font-size: 12px; }
        
        /* Full Screen Player */
        #player-wrapper { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; }
        video { width: 100%; height: 100%; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: red; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; z-index: 10000; }
        .player-label { position: absolute; top: 20px; left: 20px; color: #00ffaa; font-weight: bold; font-size: 14px; z-index: 10000; text-shadow: 0 0 5px #000; }
    </style>
</head>
<body>

    <div class="header">
        <h3 style="color:#00ffaa; margin:0;">Premium Video Unlocker</h3>
        <p style="font-size:10px; color:#888;">Invite friends to unlock VIP content</p>
    </div>

    <div class="progress-box">
        <div id="status-text" style="font-size:14px;">My Invites: 0/3</div>
        <div class="bar-bg"><div class="bar-fill" id="bar-fill"></div></div>
    </div>

    <div class="video-grid" id="video-container">
        <!-- Videos auto load here -->
    </div>

    <div id="player-wrapper">
        <div class="player-label">🛡️ PRIVATE VIP SERVER ACTIVE</div>
        <button class="close-btn" onclick="closePlayer()">CLOSE</button>
        <video id="video-player" controls autoplay playsinline></video>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const SUPABASE_URL = 'https://yctirvnryrzygoxbpvoy.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aBcD-atruskWwoCiLr0lWw_inT8GLoN';
        
        // ⚠️ আপনার Render বটের লিঙ্ক এখানে দিন (যেমন: https://mybot.onrender.com)
        const BACKEND_URL = 'https://আপনার-বট-লিঙ্ক.onrender.com'; 
        
        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '123456';
        let dbRefcount = 0;

        async function initApp() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/referrals?user_id=eq.${userId}&select=*`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const data = await res.json();
                if (data.length > 0) {
                    dbRefcount = data[0].referral_count;
                    document.getElementById('bar-fill').style.width = Math.min((dbRefcount / 3) * 100, 100) + "%";
                    document.getElementById('status-text').innerText = `My Invites: ${dbRefcount}/3`;
                }
                loadVideos();
            } catch (e) { console.log(e); }
        }

        async function loadVideos() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/videos?select=*&order=id.desc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const videos = await res.json();
                let html = '';
                videos.forEach(v => {
                    let locked = dbRefcount < v.needed_ref;
                    html += `
                        <div class="card" onclick="playVideo('${v.video_url}', ${v.needed_ref})">
                            <img src="${v.thumbnail_url.split('||')[0]}">
                            <div class="lock-icon">${locked ? '🔒' : '✅'}</div>
                            <div class="card-info">
                                <span>${locked ? 'Invite to Watch' : 'Watch Now'}</span>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('video-container').innerHTML = html;
            } catch (e) { console.log(e); }
        }

        async function playVideo(url, needed) {
            if (dbRefcount < needed) {
                alert(`You need ${needed} invites to unlock this video!`);
                return;
            }

            // যদি Stripchat বা Chaturbate লিঙ্ক হয়
            if (url.includes('stripchat.com') || url.includes('chaturbate.com')) {
                tg.MainButton.setText("Connecting to Secure Server...").show();
                try {
                    const res = await fetch(`${BACKEND_URL}/api/get_stream?url=${url}`);
                    const data = await res.json();
                    if (data.stream_url) {
                        startHLS(data.stream_url);
                    } else { alert("Stream is Offline."); }
                } catch (e) { alert("Server Error. Try again."); }
                tg.MainButton.hide();
            } else {
                startHLS(url); // For normal MP4
            }
        }

        function startHLS(m3u8) {
            const wrapper = document.getElementById('player-wrapper');
            const video = document.getElementById('video-player');
            wrapper.style.display = 'block';

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(m3u8);
                hls.attachMedia(video);
            } else { video.src = m3u8; }
        }

        function closePlayer() {
            const video = document.getElementById('video-player');
            video.pause(); video.src = "";
            document.getElementById('player-wrapper').style.display = 'none';
        }

        initApp();
    </script>
</body>
</html>
